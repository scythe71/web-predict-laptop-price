<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Price Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Laptop Price Predictor</h1>

    <form id="predict-form">
        <div class="input-group">
            <label for="processor_brand">Processor Brand</label>
            <select id="processor_brand" required>
                <option value="intel">Intel</option>
                <option value="amd">AMD</option>
            </select>
        </div>

        <div class="input-group">
            <label for="processor_tier">Processor Tier</label>
            <select id="processor_tier" required>
                <option value="core i3">Core i3</option>
                <option value="core i5">Core i5</option>
                <option value="core i7">Core i7</option>
                <!--<option value="core i9"Core i9</option-->
                <option value="ryzen 3">Ryzen 3</option>
                <option value="ryzen 5">Ryzen 5</option>
                <option value="ryzen 7">Ryzen 7</option>
                <!--<option value="ryzen 9"Ryzen 9</option-->
            </select>
        </div>

        <div class="input-group">
            <label for="num_cores">CPU Cores</label>
            <input type="number" id="num_cores" min="1" required>
        </div>

        <div class="input-group">
            <label for="num_threads">CPU Threads</label>
            <input type="number" id="num_threads" min="1" required>
        </div>

        <div class="input-group">
            <label for="ram_memory">RAM (GB)</label>
            <input type="number" id="ram_memory" min="1" required>
        </div>

        <div class="input-group">
            <label for="storage">Storage (GB)</label>
            <input type="number" id="storage" min="1" required>
        </div>

        <div class="input-group">
            <label for="gpu_type">GPU Type</label>
            <select id="gpu_type" required>
                <option value="integrated">Integrated</option>
                <option value="dedicated">Dedicated</option>
            </select>
        </div>

        <div class="input-group">
            <label for="display_size">Display Size</label>
            <input type="number" step="0.1" id="display_size" min="1" required>
        </div>

        <button type="submit">Predict Price</button>
    </form>

    <div class="result-box">
        <h2 id="result"></h2>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
